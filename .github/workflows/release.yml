name: Build release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Package project
        shell: bash
        run: |
          mkdir -p dist
          zip -r "dist/GhostR-UniversalDownloader-${GITHUB_REF_NAME}.zip" . \
            -x '.git/*' '.venv/*' 'temp/*' 'logs/*' 'tools/ffmpeg/*' '*.pyc' '__pycache__/*'

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/GhostR-UniversalDownloader-${{ github.ref_name }}.zip
